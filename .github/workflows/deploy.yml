name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login -u "${{ secrets.ACR_USERNAME }}" --password-stdin registry.ap-southeast-1.aliyuncs.com

      - name: Build and push image
        run: |
          docker build -t registry.ap-southeast-1.aliyuncs.com/focusbe/foliou:latest .
          docker push registry.ap-southeast-1.aliyuncs.com/focusbe/foliou:latest

      - name: Deploy via Coolify
        run: |
          curl --silent --show-error --fail --request GET \
            "http://47.103.216.128:8000/api/v1/deploy?uuid=ozpo6vevli3921bg7qy1onwr&force=true" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
