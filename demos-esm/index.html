<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foliou Components</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 40px 20px; background: #1a1a2e; color: #fff; min-height: 100vh; }
    h1 { text-align: center; margin-bottom: 40px; color: #e94560; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); text-decoration: none; color: inherit; display: block; transition: all 0.3s; }
    .card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.1); border-color: #e94560; }
    .card h3 { color: #fff; margin-bottom: 8px; }
    .card p { color: #888; font-size: 14px; }
    .tag { display: inline-block; background: rgba(233,69,96,0.2); color: #e94560; padding: 4px 10px; border-radius: 20px; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Foliou Components</h1>
  <div class="grid">
    <a href="#bgm" class="card" onclick="loadBgm(); return false;">
      <h3>BGM</h3>
      <p>背景音乐播放器，支持自动播放、音量控制</p>
      <span class="tag">Audio</span>
    </a>
    <a href="#device" class="card" onclick="loadDevice(); return false;">
      <h3>Device</h3>
      <p>设备检测，isMobile/isiOS/isAndroid等</p>
      <span class="tag">Utility</span>
    </a>
    <a href="#animate" class="card" onclick="loadAnimate(); return false;">
      <h3>Animate</h3>
      <p>CSS3 动画封装</p>
      <span class="tag">Animation</span>
    </a>
    <a href="#popup" class="card" onclick="loadPopup(); return false;">
      <h3>Popup</h3>
      <p>弹窗组件</p>
      <span class="tag">UI</span>
    </a>
    <a href="#swiper" class="card" onclick="loadSwiper(); return false;">
      <h3>Swiper</h3>
      <p>轮播滑动组件</p>
      <span class="tag">UI</span>
    </a>
    <a href="#touch" class="card" onclick="loadTouch(); return false;">
      <h3>Touch</h3>
      <p>触摸手势检测</p>
      <span class="tag">Utility</span>
    </a>
    <a href="#trace" class="card" onclick="loadTrace(); return false;">
      <h3>Trace</h3>
      <p>数据追踪/埋点</p>
      <span class="tag">Analytics</span>
    </a>
    <a href="#visualizer" class="card" onclick="loadVisualizer(); return false;">
      <h3>Visualizer</h3>
      <p>音频可视化</p>
      <span class="tag">Audio</span>
    </a>
    <a href="#prefix" class="card" onclick="loadPrefix(); return false;">
      <h3>Prefix</h3>
      <p>CSS/JS 前缀检测</p>
      <span class="tag">Utility</span>
    </a>
    <a href="#player" class="card" onclick="loadPlayer(); return false;">
      <h3>Player</h3>
      <p>视频播放器</p>
      <span class="tag">Media</span>
    </a>
  </div>
  <div id="demo" style="max-width:800px;margin:40px auto;padding:20px;background:rgba(255,255,255,0.05);border-radius:12px;display:none;">
    <h2 id="demo-title" style="color:#e94560;margin-bottom:16px;"></h2>
    <div id="demo-content"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
